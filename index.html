<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeMotto | Digital Sanctuary</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --text: #333230;
            --soft: #63615e;
            --accent: #a39589;
            --serif: 'Lora', serif;
        }

        body {
            background: #fffcf5; /* Başlangıç: Krem */
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 2.5s ease-in-out; /* Huzurlu renk geçişi */
            overflow: hidden;
        }

        .focus-orb {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
            animation: pulse 12s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.6; }
        }

        .app-container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            z-index: 10;
        }

        .fixed-header {
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding-bottom: 25px;
            margin-bottom: 35px;
        }

        .label {
            font-size: 0.6rem;
            letter-spacing: 5px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .fixed-en { font-family: var(--serif); font-style: italic; font-size: 1.2rem; margin: 0; opacity: 0.7; }

        .dynamic-motto-en { font-family: var(--serif); font-style: italic; font-size: 1.8rem; margin: 0 0 10px 0; line-height: 1.3; }
        .dynamic-motto-tr { font-size: 1rem; color: var(--soft); margin-bottom: 30px; font-weight: 300; }

        .ritual-box {
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: #2c2c2c;
            font-weight: 600;
            margin-bottom: 40px;
            text-transform: uppercase;
            height: 20px;
        }

        .category-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 50px;
        }

        button {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0,0,0,0.05);
            padding: 9px 22px;
            border-radius: 40px;
            cursor: pointer;
            color: var(--soft);
            font-size: 0.8rem;
            transition: all 0.4s ease;
        }

        button:hover { 
            background: white; 
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .input-group { display: flex; flex-direction: column; gap: 15px; align-items: center; }

        input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            padding: 10px;
            width: 200px;
            text-align: center;
            font-family: var(--serif);
            font-style: italic;
            outline: none;
            transition: 0.5s;
        }

        input:focus { width: 300px; border-bottom-color: var(--accent); }

        .flying-word {
            position: fixed;
            bottom: 20%;
            font-family: var(--serif);
            font-style: italic;
            color: var(--soft);
            transition: 4s cubic-bezier(0.1, 0.8, 0.3, 1);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="focus-orb"></div>

    <div class="app-container">
        <!-- SABİT MOTTO -->
        <div class="fixed-header">
            <p class="label">GÜNÜN SABİT MOTTOSU</p>
            <h2 id="fixed-en" class="fixed-en"></h2>
            <p id="fixed-tr" style="font-size: 0.85rem; color: var(--accent); margin-top: 5px;"></p>
        </div>

        <!-- DİNAMİK ALAN -->
        <div class="dynamic-wrap">
            <p class="label">KATEGORİ REHBERİ</p>
            <h1 id="dyn-en" class="dynamic-motto-en">Frekansını belirle...</h1>
            <p id="dyn-tr" class="dynamic-motto-tr">Zihnini doğru ritme çekmek için bir kategori seç.</p>
        </div>

        <div id="ritual-box" class="ritual-box">RİTÜELİNİ BAŞLAT</div>

        <nav class="category-nav" id="category-buttons"></nav>

        <div class="input-group">
            <input type="text" id="canvas-input" placeholder="Zihnini serbest bırak..." autocomplete="off">
            <input type="text" id="reward-input" placeholder="Bugünkü ödülün ne?" autocomplete="off">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        const vibeData = {
            "Odak ve Süreklilik": {
                quotes: [
                    {en: "Small consistent steps beat big occasional efforts.", tr: "Küçük ama tutarlı adımlar, büyük ama aralıklı çabalardan üstündür."},
                    {en: "Consistency is stronger than intensity.", tr: "Süreklilik, yoğunluktan daha güçlüdür."}
                ],
                words: ["DİSİPLİN", "SABIR", "RİTİM", "İSTİKRAR", "ADIM", "AKKIŞ", "NETLİK"],
                colors: ["#fff5f6", "#fce4e6", "#fbc7d4"] // PEMBE
            },
            "Plan ve Eylem": {
                quotes: [
                    {en: "Plans over moods, action over hesitation.", tr: "Duyguların önüne plan koy, tereddüt yerine harekete geç."},
                    {en: "Prepare, act, adjust.", tr: "Hazırla, uygula, gerektiğinde ayarla."}
                ],
                words: ["HAREKET", "İCRAAT", "STRATEJİ", "CESARET", "ZAMAN", "SİSTEM", "GÜÇ"],
                colors: ["#f0f7ff", "#e1f0ff", "#d1e9ff"] // MAVİ
            },
            "Anı Yaşamak": {
                quotes: [
                    {en: "This moment is enough, focus on it.", tr: "Bu an yeterli, ona odaklan."},
                    {en: "Be present, not perfect.", tr: "Mükemmel olmayı değil, şu anı yaşa."}
                ],
                words: ["FARKINDALIK", "NEFES", "VARLIK", "AKKIŞ", "SÜKUNET", "GÖZLEM", "DURGUNLUK"],
                colors: ["#fffdf0", "#fff9d4", "#f7d794"] // SARILAR
            },
            "Enerji ve Akış": {
                quotes: [
                    {en: "Energy first, then task.", tr: "Önce enerji, sonra görev."},
                    {en: "Flow with energy, not with urgency.", tr: "Aceleyle değil, enerjiyle ak."}
                ],
                words: ["CANLILIK", "DİRENÇ", "IŞILTI", "DENGE", "DÖNÜŞÜM", "YÜKSELİŞ", "TAZELEME"],
                colors: ["#f2faf5", "#e6f5ec", "#d1ebd8"] // SOFT YEŞİL (ADADAÇAYI/MİNT)
            }
        };

        const rewards = ["Harikasın!", "Süper!", "Wow!", "Mükemmel!", "Bunu hak ettin!", "Işılda! ✨", "Gurur duy!", "Harika gidiyorsun!"];

        window.onload = () => {
            const allCats = Object.keys(vibeData);
            const randomCat = allCats[Math.floor(Math.random() * allCats.length)];
            const fixedQuote = vibeData[randomCat].quotes[Math.floor(Math.random() * vibeData[randomCat].quotes.length)];
            document.getElementById('fixed-en').innerText = `"${fixedQuote.en}"`;
            document.getElementById('fixed-tr').innerText = fixedQuote.tr;

            const nav = document.getElementById('category-buttons');
            allCats.forEach(cat => {
                const btn = document.createElement('button');
                btn.innerText = cat;
                btn.onclick = () => updateTheme(cat);
                nav.appendChild(btn);
            });

            document.getElementById('canvas-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && this.value) {
                    const el = document.createElement('div');
                    el.className = 'flying-word';
                    el.innerText = this.value;
                    el.style.left = Math.random() * 60 + 20 + "%";
                    document.body.appendChild(el);
                    setTimeout(() => {
                        el.style.transform = `translateY(-300px) rotate(${Math.random() * 10 - 5}deg)`;
                        el.style.opacity = "0";
                        setTimeout(() => el.remove(), 4000);
                    }, 100);
                    this.value = "";
                }
            });

            document.getElementById('reward-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && this.value) {
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.75 }, colors: ['#fbc7d4', '#d1e9ff', '#f7d794', '#d1ebd8'] });
                    const randomMsg = rewards[Math.floor(Math.random() * rewards.length)];
                    let savedVal = this.value;
                    this.value = `${randomMsg} (${savedVal})`;
                    setTimeout(() => this.value = "", 3500);
                }
            });
        };

        function updateTheme(cat) {
            const data = vibeData[cat];
            document.getElementById('dyn-en').innerText = `"${data.quotes[Math.floor(Math.random() * data.quotes.length)].en}"`;
            document.getElementById('dyn-tr').innerText = data.quotes[0].tr; // İlk Türkçe çeviriye sabitledik veya rastgeleleştirilebilir
            
            document.getElementById('ritual-box').innerText = `ODAK: ${data.words[Math.floor(Math.random() * data.words.length)]}`;
            
            // Renk paleti seçimi
            document.body.style.backgroundColor = data.colors[Math.floor(Math.random() * data.colors.length)];
        }
    </script>
</body>
</html>
