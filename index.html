<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VibeMotto | Digital Sanctuary</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --text: #333230;
            --soft: #63615e;
            --accent: #a39589;
            --serif: 'Lora', serif;
        }

        body {
            background: #fffcf5;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 2.5s ease-in-out;
            overflow: hidden;
            touch-action: manipulation;
        }

        .focus-orb {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
            animation: pulse 12s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.6; }
        }

        .app-container {
            width: 90%;
            max-width: 500px;
            text-align: center;
            z-index: 10;
        }

        .fixed-header {
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .label {
            font-size: 0.6rem;
            letter-spacing: 5px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .fixed-en { font-family: var(--serif); font-style: italic; font-size: 1.1rem; margin: 0; opacity: 0.7; }

        .doodle-icon {
            display: block;
            margin: 0 auto 15px;
            color: var(--accent);
            opacity: 0.6;
            height: 32px;
        }

        .dynamic-motto-en { font-family: var(--serif); font-style: italic; font-size: 1.6rem; margin: 0 0 8px 0; line-height: 1.3; }
        .dynamic-motto-tr { font-size: 0.9rem; color: var(--soft); margin-bottom: 25px; font-weight: 300; }

        .ritual-box {
            font-size: 0.8rem;
            letter-spacing: 4px;
            color: #2c2c2c;
            font-weight: 600;
            margin-bottom: 35px;
            text-transform: uppercase;
            height: 20px;
        }

        .category-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 50px;
        }

        button.cat-btn {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0,0,0,0.05);
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            color: var(--soft);
            font-size: 0.75rem;
            transition: all 0.4s ease;
        }

        .smart-input-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .input-mode-btn {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            padding: 5px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            opacity: 0.4;
        }

        .input-mode-btn.active {
            opacity: 1;
            transform: scale(1.2);
            color: var(--text);
        }

        #master-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding: 10px;
            width: 200px;
            text-align: center;
            font-family: var(--serif);
            font-style: italic;
            outline: none;
            transition: 0.5s;
            font-size: 16px;
        }

        #master-input:focus { width: 260px; border-bottom-color: var(--accent); }

        .flying-word {
            position: fixed;
            bottom: 35%;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--serif);
            font-style: italic;
            color: var(--soft);
            z-index: 9999;
            pointer-events: none;
            transition: all 4s cubic-bezier(0.1, 0.8, 0.3, 1);
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="focus-orb"></div>

    <div class="app-container">
        <div class="fixed-header">
            <p class="label">GÜNÜN SABİT MOTTOSU</p>
            <h2 id="fixed-en" class="fixed-en"></h2>
            <p id="fixed-tr" style="font-size: 0.8rem; color: var(--accent); margin-top: 5px;"></p>
        </div>

        <div class="dynamic-wrap">
            <p class="label">KATEGORİ REHBERİ</p>
            <div id="companion-doodle" class="doodle-icon"></div>
            <h1 id="dyn-en" class="dynamic-motto-en">Frekansını belirle...</h1>
            <p id="dyn-tr" class="dynamic-motto-tr">Ritüeli başlatmak için kategori seç.</p>
        </div>

        <div id="ritual-box" class="ritual-box">RİTÜELİNİ BAŞLAT</div>

        <nav class="category-nav" id="category-buttons"></nav>

        <div class="smart-input-container">
            <button class="input-mode-btn active" id="btn-canvas" title="Zihni Boşalt">
                <i data-lucide="brain"></i>
            </button>
            
            <input type="text" id="master-input" placeholder="Zihnini serbest bırak..." autocomplete="off">
            
            <button class="input-mode-btn" id="btn-reward" title="Ödülünü Al">
                <i data-lucide="gift"></i>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        const vibeData = {
            "Odak ve Süreklilik": {
                quotes: [{en: "Small consistent steps beat big occasional efforts.", tr: "Küçük ama tutarlı adımlar, büyük ama aralıklı çabalardan üstündür."}],
                words: ["DİSİPLİN", "SABIR", "RİTİM", "İSTİKRAR", "ADIM", "NETLİK"],
                colors: ["#fff5f6", "#fce4e6", "#fbc7d4"],
                doodles: ["target", "compass", "anchor", "hourglass"]
            },
            "Plan ve Eylem": {
                quotes: [{en: "Plans over moods, action over hesitation.", tr: "Duyguların önüne plan koy, tereddüt yerine harekete geç."}],
                words: ["HAREKET", "İCRAAT", "STRATEJİ", "CESARET", "SİSTEM", "GÜÇ"],
                colors: ["#f0f7ff", "#e1f0ff", "#d1e9ff"],
                doodles: ["check-circle", "send", "zap", "map"]
            },
            "Anı Yaşamak": {
                quotes: [{en: "This moment is enough, focus on it.", tr: "Bu an yeterli, ona odaklan."}],
                words: ["FARKINDALIK", "NEFES", "VARLIK", "AKKIŞ", "SÜKUNET", "GÖZLEM"],
                colors: ["#fffdf0", "#fff9d4", "#f7d794"],
                doodles: ["leaf", "eye", "sun", "flower"]
            },
            "Enerji ve Akış": {
                quotes: [{en: "Energy first, then task.", tr: "Önce enerji, sonra görev."}],
                words: ["CANLILIK", "IŞILTI", "DENGE", "DÖNÜŞÜM", "YÜKSELİŞ", "TAZELEME"],
                colors: ["#f2faf5", "#e6f5ec", "#d1ebd8"],
                doodles: ["waves", "sparkles", "infinity", "droplet"]
            }
        };

        const rewardsList = ["Harikasın!", "Süper!", "Wow!", "Mükemmel!", "Bunu hak ettin!", "Işılda! ✨", "Gurur duy!", "Harika gidiyorsun!"];
        let currentMode = "canvas";

        window.onload = () => {
            lucide.createIcons();
            const allCats = Object.keys(vibeData);
            const randomCat = allCats[Math.floor(Math.random() * allCats.length)];
            const fixedQuote = vibeData[randomCat].quotes[0];
            document.getElementById('fixed-en').innerText = `"${fixedQuote.en}"`;
            document.getElementById('fixed-tr').innerText = fixedQuote.tr;

            const nav = document.getElementById('category-buttons');
            allCats.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = "cat-btn";
                btn.innerText = cat;
                btn.onclick = () => updateTheme(cat);
                nav.appendChild(btn);
            });

            setupSmartInput();
        };

        function setupSmartInput() {
            const masterInput = document.getElementById('master-input');
            const btnCanvas = document.getElementById('btn-canvas');
            const btnReward = document.getElementById('btn-reward');

            btnCanvas.onclick = () => {
                currentMode = "canvas";
                masterInput.placeholder = "Zihnini serbest bırak...";
                btnCanvas.classList.add('active');
                btnReward.classList.remove('active');
            };

            btnReward.onclick = () => {
                currentMode = "reward";
                masterInput.placeholder = "Bugünkü ödülün ne?";
                btnReward.classList.add('active');
                btnCanvas.classList.remove('active');
            };

            masterInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.keyCode === 13) {
                    e.preventDefault();
                    let val = this.value.trim();
                    if (val !== "") {
                        if (currentMode === "canvas") {
                            createFloatingWord(val);
                            this.value = "";
                            this.blur();
                        } else {
                            // ÖDÜL MODU ÇALIŞIYOR
                            confetti({ particleCount: 150, spread: 80, origin: { y: 0.75 }, colors: ['#fbc7d4', '#d1e9ff', '#f7d794', '#d1ebd8'] });
                            const randomMsg = rewardsList[Math.floor(Math.random() * rewardsList.length)];
                            this.value = `${randomMsg} (${val})`;
                            setTimeout(() => { this.value = ""; }, 3500);
                            this.blur();
                        }
                    }
                }
            });
        }

        function createFloatingWord(val) {
            const el = document.createElement('div');
            el.className = 'flying-word';
            el.innerText = val;
            el.style.left = Math.random() * 60 + 20 + "%";
            document.body.appendChild(el);
            setTimeout(() => {
                el.style.transform = `translate(-50%, -450px) rotate(${Math.random() * 20 - 10}deg)`;
                el.style.opacity = "0";
                setTimeout(() => el.remove(), 4000);
            }, 50);
        }

        function updateTheme(cat) {
            const data = vibeData[cat];
            document.getElementById('dyn-en').innerText = `"${data.quotes[0].en}"`;
            document.getElementById('dyn-tr').innerText = data.quotes[0].tr;
            document.getElementById('ritual-box').innerText = `ODAK: ${data.words[Math.floor(Math.random() * data.words.length)]}`;
            document.body.style.backgroundColor = data.colors[Math.floor(Math.random() * data.colors.length)];

            const companion = document.getElementById('companion-doodle');
            companion.style.opacity = "0";
            setTimeout(() => {
                companion.innerHTML = `<i data-lucide="${data.doodles[Math.floor(Math.random() * data.doodles.length)]}"></i>`;
                lucide.createIcons();
                companion.style.opacity = "0.6";
            }, 400);
        }
    </script>
<!-- Mini Gezgin Menü -->
<div id="zen-navigator">
    <button class="nav-trigger">✦</button>
    <div class="nav-content">
        <a href="https://zynep-cell.github.io/The-Core-Zen/">🏠 Ana Menü</a>
        <a href="https://zynep-cell.github.io/neurovibe/">🧠 NeuroVibe</a>
        <a href="https://zynep-cell.github.io/VibeMatch/">🔤 VibeMatch</a>
        <a href="https://zynep-cell.github.io/VibeMotto/">📖 VibeMotto</a>
    </div>
</div>

<style>
    #zen-navigator {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        font-family: 'Quicksand', sans-serif;
    }

    .nav-trigger {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(5px);
        border: 1px solid rgba(0,0,0,0.1);
        width: 45px;
        height: 45px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 20px;
        color: #5a6b7d;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        transition: transform 0.3s;
    }

    .nav-content {
        display: none;
        position: absolute;
        bottom: 55px;
        right: 0;
        background: white;
        padding: 10px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        width: 150px;
        flex-direction: column;
        gap: 8px;
    }

    .nav-content a {
        text-decoration: none;
        color: #5a6b7d;
        font-size: 0.85rem;
        padding: 8px;
        border-radius: 8px;
        transition: background 0.2s;
    }

    .nav-content a:hover {
        background: #f0f4f8;
    }

    #zen-navigator:hover .nav-content {
        display: flex;
    }

    #zen-navigator:hover .nav-trigger {
        transform: rotate(90deg);
    }
</style>
</body>
</html>
