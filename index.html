<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeMotto | Digital Sanctuary</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <div id="focus-orb" class="focus-orb"></div>

    <div class="app-container">
        <header class="header-section">
            <div id="motto-display" class="motto-display">
                <p id="motto-en" class="motto-en">"Select a category to begin your ritual."</p>
                <p id="motto-tr" class="motto-tr"></p>
            </div>
            <div id="ritual-box" class="ritual-text">HOŞ GELDİN</div>
        </header>

        <nav class="category-nav" id="category-buttons"></nav>

        <section class="interaction-area">
            <div class="input-group">
                <input type="text" id="canvas-input" placeholder="Zihnini serbest bırak...">
            </div>
            <div class="input-group">
                <input type="text" id="reward-input" placeholder="Bugünkü ödülün ne?">
            </div>
        </section>
    </div>

    <!-- Kütüphaneler ve JS (Lütfen bu sırayı bozma) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
