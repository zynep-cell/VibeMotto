<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeMotto | Zaze Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --text: #2c2c2c;
            --soft: #555555;
            --accent: #8a817c;
            --serif: 'Lora', serif;
        }

        body {
            background: linear-gradient(135deg, #fdfbf9 0%, #f4f1ea 100%);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: all 2s ease; /* Renk geçişi yumuşaklığı */
            overflow: hidden;
        }

        .focus-orb {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 550px; height: 550px;
            border: 1px solid rgba(0,0,0,0.03);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
            animation: pulse 10s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.6; }
        }

        .app-container {
            width: 90%;
            max-width: 650px;
            text-align: center;
            z-index: 10;
        }

        /* Sabit Günün Mottosu */
        .fixed-motto-section {
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding-bottom: 30px;
            margin-bottom: 30px;
        }

        .label {
            font-size: 0.65rem;
            letter-spacing: 5px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        /* Dinamik Alan */
        .dynamic-section { min-height: 140px; margin-bottom: 30px; }

        .motto-en { font-family: var(--serif); font-style: italic; font-size: 1.6rem; margin: 0 0 8px 0; }
        .motto-tr { font-size: 0.95rem; color: var(--soft); font-weight: 300; }

        .ritual-box {
            font-size: 0.9rem;
            letter-spacing: 3px;
            color: #2c2c2c;
            font-weight: 500;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        .category-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 50px;
        }

        button {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(0,0,0,0.05);
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            color: var(--soft);
            font-size: 0.8rem;
            transition: 0.4s;
        }

        button:hover { background: white; border-color: var(--accent); color: var(--text); }

        .input-group { display: flex; flex-direction: column; gap: 15px; align-items: center; }

        input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding: 10px;
            width: 220px;
            text-align: center;
            font-family: var(--serif);
            font-style: italic;
            outline: none;
            transition: 0.5s;
        }

        input:focus { width: 300px; border-bottom-color: var(--accent); }

        .flying-word {
            position: fixed;
            bottom: 20%;
            font-family: var(--serif);
            font-style: italic;
            color: var(--soft);
            transition: 4s ease-out;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="focus-orb"></div>

    <div class="app-container">
        <!-- SABİT MOTTO (Günün Çapası) -->
        <div class="fixed-motto-section">
            <p class="label">GÜNÜN SABİT MOTTOSU</p>
            <h2 id="fixed-en" style="font-family: var(--serif); font-size: 1.3rem; opacity: 0.8;"></h2>
            <p id="fixed-tr" style="font-size: 0.9rem; color: var(--accent);"></p>
        </div>

        <!-- DİNAMİK MOTTO (Kategoriye Özel) -->
        <div class="dynamic-section">
            <p class="label">KATEGORİ REHBERİ</p>
            <h1 id="dyn-en" class="motto-en">Kategori seçerek başla...</h1>
            <p id="dyn-tr" class="motto-tr"></p>
        </div>

        <div id="ritual-box" class="ritual-box">ODAK SEÇİLMEDİ</div>

        <nav class="category-nav" id="category-buttons"></nav>

        <div class="input-group">
            <input type="text" id="canvas-input" placeholder="Zihnini serbest bırak..." autocomplete="off">
            <input type="text" id="reward-input" placeholder="Bugünkü ödülün ne?" autocomplete="off">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        const vibeData = {
            "Odak ve Süreklilik": {
                quotes: [
                    {en: "Small consistent steps beat big occasional efforts.", tr: "Küçük ama tutarlı adımlar, büyük ama aralıklı çabalardan üstündür."},
                    {en: "Consistency is stronger than intensity.", tr: "Süreklilik, yoğunluktan daha güçlüdür."}
                ],
                words: ["DİSİPLİN", "SABIR", "RİTİM", "İSTİKRAR", "ADIM", "AKKIŞ", "NETLİK"],
                colors: ["#f4f1ea", "#e8e2d9", "#dcd3c9"]
            },
            "Plan ve Eylem": {
                quotes: [
                    {en: "Plans over moods, action over hesitation.", tr: "Duyguların önüne plan koy, tereddüt yerine harekete geç."},
                    {en: "A plan in action beats a perfect plan waiting.", tr: "Bekleyen mükemmel bir plan, uygulamadaki bir plandan daha az etkilidir."}
                ],
                words: ["HAREKET", "İCRAAT", "STRATEJİ", "CESARET", "ZAMAN", "SİSTEM", "GÜÇ"],
                colors: ["#edf2f4", "#dae1e7", "#c9d6df"]
            },
            "Anı Yaşamak": {
                quotes: [
                    {en: "This moment is enough, focus on it.", tr: "Bu an yeterli, ona odaklan."},
                    {en: "Be present, not perfect.", tr: "Mükemmel olmayı değil, şu anı yaşa."}
                ],
                words: ["FARKINDALIK", "NEFES", "VARLIK", "AKKIŞ", "SÜKUNET", "GÖZLEM", "DURGUNLUK"],
                colors: ["#f1f4f1", "#e2e8e2", "#d4dbd4"]
            },
            "Stres Yönetimi": {
                quotes: [
                    {en: "Feel it, don’t fight it.", tr: "Hisset, savaşma."},
                    {en: "Worry less, act more.", tr: "Daha az kaygılan, daha çok harekete geç."}
                ],
                words: ["HUZUR", "DENGE", "GÜVEN", "ŞEFKAT", "YAVAŞLIK", "TAHLİYE", "SABIR"],
                colors: ["#fdf4f5", "#f9e7e9", "#f4dadd"]
            }
        };

        const rewards = ["Harikasın!", "Süper!", "Wow!", "Mükemmel!", "Bunu hak ettin!", "Işılda! ✨", "Gurur duy!"];

        window.onload = () => {
            // 1. Sabit Mottoyu Belirle (Sayfa açıldığında değişmez)
            const allCats = Object.keys(vibeData);
            const randomCat = allCats[Math.floor(Math.random() * allCats.length)];
            const fixedQuote = vibeData[randomCat].quotes[Math.floor(Math.random() * vibeData[randomCat].quotes.length)];
            document.getElementById('fixed-en').innerText = `"${fixedQuote.en}"`;
            document.getElementById('fixed-tr').innerText = fixedQuote.tr;

            // 2. Butonları Oluştur
            const nav = document.getElementById('category-buttons');
            allCats.forEach(cat => {
                const btn = document.createElement('button');
                btn.innerText = cat;
                btn.onclick = () => updateTheme(cat);
                nav.appendChild(btn);
            });

            // 3. Kanvas Uçurma
            document.getElementById('canvas-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && this.value) {
                    const el = document.createElement('div');
                    el.className = 'flying-word';
                    el.innerText = this.value;
                    el.style.left = Math.random() * 60 + 20 + "%";
                    document.body.appendChild(el);
                    setTimeout(() => {
                        el.style.transform = `translateY(-350px) rotate(${Math.random() * 20 - 10}deg)`;
                        el.style.opacity = "0";
                        setTimeout(() => el.remove(), 4000);
                    }, 100);
                    this.value = "";
                }
            });

            // 4. Ödül Kutlaması
            document.getElementById('reward-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && this.value) {
                    confetti({ particleCount: 120, spread: 80, origin: { y: 0.7 }, colors: ['#8a817c', '#dcd3c9', '#fdfbf9'] });
                    const randomMsg = rewards[Math.floor(Math.random() * rewards.length)];
                    let savedVal = this.value;
                    this.value = `${randomMsg} (${savedVal})`;
                    setTimeout(() => this.value = "", 3000);
                }
            });
        };

        function updateTheme(cat) {
            const data = vibeData[cat];
            
            // Dinamik Motto Değişimi
            const randomQuote = data.quotes[Math.floor(Math.random() * data.quotes.length)];
            document.getElementById('dyn-en').innerText = `"${randomQuote.en}"`;
            document.getElementById('dyn-tr').innerText = randomQuote.tr;

            // Odak Kelimesi Değişimi
            const randomWord = data.words[Math.floor(Math.random() * data.words.length)];
            document.getElementById('ritual-box').innerText = `ODAK: ${randomWord}`;

            // Renk Geçişi (3 soft renkten rastgele seçer)
            const randomColor = data.colors[Math.floor(Math.random() * data.colors.length)];
            document.body.style.background = `radial-gradient(circle at center, white 0%, ${randomColor} 100%)`;
        }
    </script>
</body>
</html>
