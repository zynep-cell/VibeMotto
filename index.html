<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeMotto</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <div id="focus-orb" class="focus-orb"></div>

    <div class="app-container">
        <!-- Motto Alanı -->
        <div id="motto-wrap" class="motto-wrap">
            <h1 id="motto-en"></h1>
            <p id="motto-tr"></p>
        </div>

        <!-- Odak Kelimesi -->
        <div id="ritual-box" class="ritual-box"></div>

        <!-- Kategoriler -->
        <nav class="category-nav" id="category-buttons"></nav>

        <!-- Etkileşim -->
        <div class="interaction-group">
            <input type="text" id="canvas-input" placeholder="Zihnini serbest bırak..." autocomplete="off">
            <input type="text" id="reward-input" placeholder="Bugünkü ödülün ne?" autocomplete="off">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
