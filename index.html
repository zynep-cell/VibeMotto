<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VibeMotto | Digital Sanctuary</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --text: #333230;
            --soft: #63615e;
            --accent: #a39589;
            --serif: 'Lora', serif;
        }

        body {
            background: #fffcf5;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            transition: background 2.5s ease-in-out;
            overflow: hidden;
            touch-action: manipulation;
        }

        .focus-orb {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
            animation: pulse 12s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.6; }
        }

        .app-container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            z-index: 10;
            padding: 20px 0;
        }

        .fixed-header {
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .label {
            font-size: 0.6rem;
            letter-spacing: 5px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .fixed-en { font-family: var(--serif); font-style: italic; font-size: 1.1rem; margin: 0; opacity: 0.7; }

        .doodle-icon {
            display: block;
            margin: 0 auto 15px;
            color: var(--accent);
            opacity: 0;
            transition: all 0.8s ease;
            height: 32px;
        }

        .dynamic-motto-en { font-family: var(--serif); font-style: italic; font-size: 1.6rem; margin: 0 0 8px 0; line-height: 1.3; }
        .dynamic-motto-tr { font-size: 0.9rem; color: var(--soft); margin-bottom: 25px; font-weight: 300; }

        .ritual-box {
            font-size: 0.8rem;
            letter-spacing: 4px;
            color: #2c2c2c;
            font-weight: 600;
            margin-bottom: 35px;
            text-transform: uppercase;
            height: 20px;
        }

        .category-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        button {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0,0,0,0.05);
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            color: var(--soft);
            font-size: 0.75rem;
            transition: all 0.4s ease;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover { background: white; transform: translateY(-2px); }

        .input-group { display: flex; flex-direction: column; gap: 12px; align-items: center; }

        input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            padding: 10px;
            width: 180px;
            text-align: center;
            font-family: var(--serif);
            font-style: italic;
            outline: none;
            transition: 0.5s;
            font-size: 16px; /* Mobil tarayıcılarda zoom yapmaması için minimum 16px */
        }

        input:focus { width: 260px; border-bottom-color: var(--accent); }

        .flying-word {
            position: fixed;
            bottom: 35%;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--serif);
            font-style: italic;
            color: var(--soft);
            z-index: 9999;
            pointer-events: none;
            transition: all 4s cubic-bezier(0.1, 0.8, 0.3, 1);
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="focus-orb"></div>

    <div class="app-container">
        <!-- SABİT MOTTO -->
        <div class="fixed-header">
            <p class="label">GÜNÜN SABİT MOTTOSU</p>
            <h2 id="fixed-en" class="fixed-en"></h2>
            <p id="fixed-tr" style="font-size: 0.8rem; color: var(--accent); margin-top: 5px;"></p>
        </div>

        <!-- DİNAMİK ALAN -->
        <div class="dynamic-wrap">
            <p class="label">KATEGORİ REHBERİ</p>
            <div id="companion-doodle" class="doodle-icon"></div>
            <h1 id="dyn-en" class="dynamic-motto-en">Frekansını belirle...</h1>
            <p id="dyn-tr" class="dynamic-motto-tr">Bir kategori seçerek ritüeli başlat.</p>
        </div>

        <div id="ritual-box" class="ritual-box">RİTÜELİNİ BAŞLAT</div>

        <nav class="category-nav" id="category-buttons"></nav>

        <div class="input-group">
            <input type="text" id="canvas-input" placeholder="Zihnini serbest bırak..." autocomplete="off">
            <input type="text" id="reward-input" placeholder="Bugünkü ödülün ne?" autocomplete="off">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        const vibeData = {
            "Odak ve Süreklilik": {
                quotes: [
                    {en: "Small consistent steps beat big occasional efforts.", tr: "Küçük ama tutarlı adımlar, büyük ama aralıklı çabalardan üstündür."},
                    {en: "Consistency is stronger than intensity.", tr: "Süreklilik, yoğunluktan daha güçlüdür."}
                ],
                words: ["DİSİPLİN", "SABIR", "RİTİM", "İSTİKRAR", "ADIM", "NETLİK"],
                colors: ["#fff5f6", "#fce4e6", "#fbc7d4"],
                doodles: ["target", "compass", "anchor", "hourglass"]
            },
            "Plan ve Eylem": {
                quotes: [
                    {en: "Plans over moods, action over hesitation.", tr: "Duyguların önüne plan koy, tereddüt yerine harekete geç."},
                    {en: "Prepare, act, adjust.", tr: "Hazırla, uygula, gerektiğinde ayarla."}
                ],
                words: ["HAREKET", "İCRAAT", "STRATEJİ", "CESARET", "SİSTEM", "GÜÇ"],
                colors: ["#f0f7ff", "#e1f0ff", "#d1e9ff"],
                doodles: ["check-circle", "send", "zap", "map"]
            },
            "Anı Yaşamak": {
                quotes: [
                    {en: "This moment is enough, focus on it.", tr: "Bu an yeterli, ona odaklan."},
                    {en: "Be present, not perfect.", tr: "Mükemmel olmayı değil, şu anı yaşa."}
                ],
                words: ["FARKINDALIK", "NEFES", "VARLIK", "AKKIŞ", "SÜKUNET", "GÖZLEM"],
                colors: ["#fffdf0", "#fff9d4", "#f7d794"],
                doodles: ["leaf", "eye", "sun", "flower"]
            },
            "Enerji ve Akış": {
                quotes: [
                    {en: "Energy first, then task.", tr: "Önce enerji, sonra görev."},
                    {en: "Flow with energy, not with urgency.", tr: "Aceleyle değil, enerjiyle ak."}
                ],
                words: ["CANLILIK", "IŞILTI", "DENGE", "DÖNÜŞÜM", "YÜKSELİŞ", "TAZELEME"],
                colors: ["#f2faf5", "#e6f5ec", "#d1ebd8"],
                doodles: ["waves", "sparkles", "infinity", "droplet"]
            }
        };

        const rewards = ["Harikasın!", "Süper!", "Wow!", "Işılda! ✨", "Gurur duy!", "Mükemmel!"];

        window.onload = () => {
            const allCats = Object.keys(vibeData);
            const randomCat = allCats[Math.floor(Math.random() * allCats.length)];
            const fixedQuote = vibeData[randomCat].quotes[Math.floor(Math.random() * vibeData[randomCat].quotes.length)];
            document.getElementById('fixed-en').innerText = `"${fixedQuote.en}"`;
            document.getElementById('fixed-tr').innerText = fixedQuote.tr;

            const nav = document.getElementById('category-buttons');
            allCats.forEach(cat => {
                const btn = document.createElement('button');
                btn.innerText = cat;
                btn.onclick = () => updateTheme(cat);
                nav.appendChild(btn);
            });

            // Mobil Uyumlu Giriş Fonksiyonları
            setupInputEffects();
        };

        function setupInputEffects() {
            const canvasInput = document.getElementById('canvas-input');
            const rewardInput = document.getElementById('reward-input');

            const handleInput = (e, callback) => {
                if (e.key === 'Enter' || e.keyCode === 13) {
                    e.preventDefault();
                    if (e.target.value.trim() !== "") {
                        callback(e.target.value);
                        e.target.value = "";
                        e.target.blur(); // Klavyeyi kapat (Mobilde uçuşu görmek için)
                    }
                }
            };

            canvasInput.addEventListener('keydown', (e) => handleInput(e, createFloatingWord));
            rewardInput.addEventListener('keydown', (e) => handleInput(e, triggerConfetti));
        }

        function createFloatingWord(val) {
            const el = document.createElement('div');
            el.className = 'flying-word';
            el.innerText = val;
            el.style.left = Math.random() * 60 + 20 + "%";
            document.body.appendChild(el);
            
            requestAnimationFrame(() => {
                setTimeout(() => {
                    el.style.transform = `translate(-50%, -450px) rotate(${Math.random() * 20 - 10}deg)`;
                    el.style.opacity = "0";
                    setTimeout(() => el.remove(), 4000);
                }, 50);
            });
        }

        function triggerConfetti(val) {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.75 }, colors: ['#fbc7d4', '#d1e9ff', '#f7d794', '#d1ebd8'] });
            const msg = rewards[Math.floor(Math.random() * rewards.length)];
            document.getElementById('reward-input').value = `${msg} (${val})`;
            setTimeout(() => { document.getElementById('reward-input').value = ""; }, 3000);
        }

        function updateTheme(cat) {
            const data = vibeData[cat];
            const quote = data.quotes[Math.floor(Math.random() * data.quotes.length)];
            
            document.getElementById('dyn-en').innerText = `"${quote.en}"`;
            document.getElementById('dyn-tr').innerText = quote.tr;
            document.getElementById('ritual-box').innerText = `ODAK: ${data.words[Math.floor(Math.random() * data.words.length)]}`;
            document.body.style.backgroundColor = data.colors[Math.floor(Math.random() * data.colors.length)];

            const companion = document.getElementById('companion-doodle');
            companion.style.opacity = "0";
            companion.style.transform = "scale(0.8)";
            
            setTimeout(() => {
                companion.innerHTML = `<i data-lucide="${data.doodles[Math.floor(Math.random() * data.doodles.length)]}"></i>`;
                lucide.createIcons();
                companion.style.opacity = "0.6";
                companion.style.transform = "scale(1)";
            }, 400);
        }
    </script>
</body>
</html>
